[package]
name = "aio-asset-normalizer"
version = "0.1.0"
edition = "2021"
default-run = "aio-asset-normalizer"
description = "A cross-platform GLB editor and generic BVH motion standardization tool with a local MCP server"
license = "MIT"
authors = []

[features]
default = ["desktop"]
desktop = ["dep:three-d", "dep:three-d-asset", "dep:egui-phosphor", "dep:winit", "dep:rfd", "dep:arboard", "dep:open", "dep:sys-locale", "dep:serde_yaml", "dep:winres", "dep:muda"]
mcp = ["dep:rmcp", "dep:tokio"]

[[bin]]
name = "aio-asset-normalizer"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "aio-asset-normalizer-mcp"
path = "src/bin/aio-asset-normalizer-mcp/main.rs"
required-features = ["mcp"]

[[test]]
name = "mcp_server"
required-features = ["mcp"]

[dependencies]
three-d = { version = "0.19", features = ["egui-gui"], optional = true }
gltf = { version = "1.4", features = ["KHR_lights_punctual", "extensions", "names"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
sha2 = "0.10"
schemars = "1.2"
tempfile = "3"
sys-locale = { version = "0.3", optional = true }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = { version = "0.15", optional = true }
arboard = { version = "3", optional = true }
open = { version = "5", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
winit = { version = "0.28", optional = true }

three-d-asset = { version = "0.10", features = ["gltf", "image"], optional = true }
egui-phosphor = { version = "0.12", optional = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false, optional = true }
